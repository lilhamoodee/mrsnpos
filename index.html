<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marisini POS</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B1F36"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Font lokal (woff2) agar tampilan tetap identik saat offline di pantai */
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/playfair-display-latin.woff2") format("woff2")}
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:800;font-display:swap;src:url("fonts/playfair-display-latin.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/manrope-latin.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/manrope-latin.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-style:normal;font-weight:800;font-display:swap;src:url("fonts/manrope-latin.woff2") format("woff2")}
:root{--bg:#F3F5F7;--c:#fff;--ink:#0B2239;--mu:#566678;--ln:#D3D9E0;--sky:#1E9BE0;--am:#F5A800;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;padding:14px 14px 220px}
header{display:flex;align-items:center;gap:10px}
.tile{width:48px;height:48px;border-radius:12px;background:#fff;border:1px solid var(--ln);display:grid;place-items:center}
.tile img{width:42px;height:42px;object-fit:contain}
.wm{font-weight:800;letter-spacing:.1em;font-size:19px}.wm b{color:var(--sky)}
.sub{font-size:14px;color:var(--mu)}
.lnk{border:0;background:none;padding:0;font:inherit;font-size:14px;color:var(--mu);text-decoration:underline;cursor:pointer}
.pill{margin-left:auto;font-size:13px;padding:6px 10px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
.pill.w{border-color:var(--am);color:var(--ink);font-weight:700}
.lbl{font-weight:700;font-size:15px;color:var(--mu);margin:18px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{flex:1;min-height:56px;min-width:84px;border:2px solid var(--ln);border-radius:12px;background:var(--c);color:var(--ink);font-weight:700;font-size:16px;font-family:inherit;padding:8px 10px;cursor:pointer}
.grid .chip{text-align:left;min-height:72px}
.chip small{display:block;font-weight:600;font-size:14px;color:var(--mu)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.on small{color:#fff;opacity:.85}
.step{display:flex;align-items:center;gap:16px}
.step button{width:56px;height:56px;border-radius:12px;border:2px solid var(--ln);background:var(--c);color:var(--ink);font-size:28px;cursor:pointer}
.step span{font-size:28px;font-weight:800;min-width:40px;text-align:center}
.tot{background:var(--c);border:2px solid var(--ln);border-left:5px solid var(--am);border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:8px}
.tot b{font-size:22px;color:var(--mu)}
.tot input{border:0;background:none;color:var(--ink);font-size:34px;font-weight:800;width:100%;outline:none;font-family:inherit}
.in{width:100%;min-height:52px;border-radius:12px;border:2px solid var(--ln);background:var(--c);color:var(--ink);padding:0 14px;font-size:17px;font-family:inherit}
.btn{display:flex;align-items:center;justify-content:center;min-height:60px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:18px;font-family:inherit;text-decoration:none;cursor:pointer;width:100%}
.btn.alt{background:var(--sky)}.btn.ghost{background:none;color:var(--ink);border:2px solid var(--ln)}
#bar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));padding:10px 14px;background:var(--bg);border-top:1px solid var(--ln);z-index:3}
#bar .btn{max-width:452px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
nav button{flex:1;min-height:60px;border:0;background:none;color:var(--mu);font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}
nav button.on{color:var(--ink);box-shadow:inset 0 4px 0 var(--am)}
.rc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rc>div{background:var(--c);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;display:grid}
.rc b{font-size:20px}.rc .all{grid-column:1/-1;border-left:5px solid var(--am)}.rc .all b{font-size:32px}
.li{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.rt{text-align:right}
#sheet,#lock{position:fixed;inset:0;display:flex;z-index:9}
#sheet{background:rgba(8,20,36,.6);align-items:flex-end;justify-content:center}
.box{background:var(--c);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
#lock{background:var(--bg);align-items:center;justify-content:center;padding:24px;z-index:20}
.lbox{width:100%;max-width:320px;display:grid;gap:12px;text-align:center;justify-items:center}
.lbox .in{text-align:center;font-size:20px}
#struk{background:#fff;color:#000;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;width:100%;max-width:260px;margin:10px auto 14px;padding:12px;border:1px dashed #bbb}
#struk img{display:block;margin:0 auto 4px;width:70px;filter:grayscale(1) contrast(1.3)}
#struk hr{border:0;border-top:1px dashed #000;margin:6px 0}
.c{text-align:center}.b{font-weight:700}.r2{display:flex;justify-content:space-between;gap:8px}
.acts{display:grid;gap:8px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}
:root{--bg:#F7F3EC;--c:#FFFEFB;--ink:#0B1F36;--mu:#6B6657;--ln:#E4DCCB;--gold:#C9A24B;--gold2:#E9D49A;--navy2:#173A60;--serif:"Playfair Display",Georgia,"Times New Roman",serif;--num:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(120% 60% at 50% 0,#fff 0,var(--bg) 60%) fixed}
header{background:linear-gradient(135deg,var(--ink),var(--navy2));margin:-14px -14px 4px;padding:14px;border-radius:0 0 22px 22px;box-shadow:0 10px 24px -14px rgba(11,31,54,.6);position:relative}
header::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.tile{border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.18)}
.wm{font-family:var(--serif);color:#F7F3EC;letter-spacing:.14em}.wm b{color:#6CC4F5}
.lnk{color:var(--gold2)}
.pill{border-color:rgba(233,212,154,.5);color:#F2E3B5}.pill.w{color:#fff;border-color:var(--gold);animation:pulse 2s infinite}
.lbl{color:#7A6A4A;letter-spacing:.05em;display:flex;align-items:center;gap:10px}
.lbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#D9C58F,transparent)}
.chip{background:var(--c);border:1.5px solid var(--ln);box-shadow:0 1px 0 #fff inset,0 6px 14px -10px rgba(11,31,54,.35);transition:transform .12s,box-shadow .2s,border-color .2s}
.chip:active{transform:scale(.96)}
.chip small{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;color:#8A6A1F}
.chip.on{background:linear-gradient(135deg,var(--ink),var(--navy2));border-color:var(--gold);color:#fff;animation:pop .3s}
.chip.on small{color:var(--gold2);opacity:1}
.step button{background:var(--c);border-color:var(--ln);color:var(--ink);transition:transform .12s}.step button:active{transform:scale(.9)}
.step span{font-family:var(--num);font-weight:800}
.tot{border:1.5px solid var(--ln);border-left:0;padding-left:20px;position:relative;overflow:hidden;box-shadow:0 8px 18px -14px rgba(11,31,54,.5)}
.tot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--gold2),var(--gold))}
.tot b{color:#8A6A1F;font-family:var(--num);font-weight:700}.tot input{font-family:var(--num);font-weight:800;font-variant-numeric:tabular-nums}
.btn{background:linear-gradient(135deg,var(--ink),var(--navy2));color:var(--gold2);border:1px solid var(--gold);letter-spacing:.06em;box-shadow:0 10px 20px -10px rgba(11,31,54,.7);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.65;pointer-events:none}
.btn.alt{background:linear-gradient(135deg,#1E9BE0,#2B6CB0);color:#fff;border-color:transparent}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ln);box-shadow:none}
#go{position:relative;overflow:hidden}
#go::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(233,212,154,.35) 50%,transparent 65%);animation:shine 3.4s infinite}
#bar{background:rgba(247,243,236,.92);backdrop-filter:blur(10px);border-top:1px solid var(--ln)}
nav{background:rgba(255,254,251,.96);backdrop-filter:blur(10px)}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--gold)}
.rc>div{background:var(--c);border-color:var(--ln);box-shadow:0 8px 18px -14px rgba(11,31,54,.5)}
.rc b,.rt b,#go{font-family:var(--num);font-variant-numeric:tabular-nums}
.rc .all{background:linear-gradient(135deg,var(--ink),var(--navy2));border:1px solid var(--gold)}
.rc .all b{color:var(--gold2)}.rc .all .sub{color:#B9C6D6}
.li{transition:background .2s}.li:active{background:rgba(201,162,75,.12)}
.in{background:var(--c);border-color:var(--ln)}.in:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.2)}
#sheet{animation:fade .25s}.box{animation:slide .38s cubic-bezier(.2,.8,.2,1);border-top:3px solid var(--gold)}
#lock{background:linear-gradient(160deg,var(--ink),var(--navy2));color:#F7F3EC}
#lock .sub,#lerr{color:var(--gold2)}
#toast{background:var(--ink);color:var(--gold2);border:1px solid var(--gold)}
.fx>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.fx>:nth-child(n+2){animation-delay:.05s}.fx>:nth-child(n+4){animation-delay:.1s}.fx>:nth-child(n+6){animation-delay:.15s}.fx>:nth-child(n+8){animation-delay:.2s}.fx>:nth-child(n+10){animation-delay:.25s}
.fx .li{animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,162,75,.55)}50%{box-shadow:0 0 0 7px rgba(201,162,75,0)}}
header{gap:12px;align-items:center;padding:14px 16px}
.tile{width:60px;height:60px;border-radius:50%;flex:none}
.tile img{width:50px;height:50px;object-fit:contain}
header>div:nth-child(2){display:grid;gap:3px;min-width:0}
.wm{font-size:21px;line-height:1.1}
.lnk{justify-self:start;text-decoration:none;border-bottom:1px dotted rgba(233,212,154,.6);padding-bottom:1px}
.pill{flex:none}
#lock .tile{width:96px;height:96px}#lock .tile img{width:82px;height:82px}
.ps{font-family:var(--num);font-size:11px;font-weight:800;letter-spacing:.18em;color:#0B1F36;background:linear-gradient(135deg,var(--gold2),var(--gold));padding:3px 7px 3px 9px;border-radius:6px;margin-left:8px;vertical-align:middle}
.tile{overflow:hidden;padding:0}
.tile img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.wm{font-size:19px;letter-spacing:.1em}
/* Gaya transaksi batal & formulir konfirmasi batal */
.li.void{opacity:.65}
.li.void .vn,.li.void .rt b{text-decoration:line-through}
.bdg{display:inline-block;font-family:var(--num);font-size:11px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}
.bdg.v{background:#FDECEC;color:#9B1C1C;border:1px solid #F5B5B5}
.btn.danger{background:linear-gradient(135deg,#9B1C1C,#B42318);color:#fff;border-color:#9B1C1C}
.btn.danger-ghost{background:#FFF8F8;color:#9B1C1C;border:1.5px solid #E8B4B4;box-shadow:none}
#vform{display:grid;gap:10px;margin:10px 0 4px;padding:12px;border-radius:14px;background:#FFF8F8;border:1.5px solid #E8B4B4}
#vform .lbl{margin:0;color:#9B1C1C}
#vform .chip{min-height:48px;font-size:14px;padding:6px 10px}
#struk .vban{border:1px dashed #000;padding:3px 4px;margin:4px 0;font-weight:700;text-align:center;letter-spacing:.06em}
/* Gaya Tutup Kasir harian */
.bdg.ok{background:#E8F6EE;color:#157347;border:1px solid #B5DFC7}
#csheet{position:fixed;inset:0;display:flex;background:rgba(8,20,36,.6);align-items:flex-end;justify-content:center;z-index:8;animation:fade .25s}
.cbox{display:grid;gap:10px}
.csum{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px;display:grid;gap:6px}
.csum .r2 b{font-family:var(--num);font-variant-numeric:tabular-nums}
.csum .hr{height:1px;background:var(--ln);margin:2px 0}
.cdiff{padding:10px 12px;border-radius:12px;font-family:var(--num);font-weight:800;font-variant-numeric:tabular-nums;border:1.5px solid var(--ln);background:var(--bg)}
.cdiff.ok{background:#E8F6EE;color:#157347;border-color:#B5DFC7}
.cdiff.neg{background:#FDECEC;color:#9B1C1C;border-color:#F5B5B5}
.cdiff.pos{background:#FEF8E6;color:#7A5A12;border-color:var(--gold)}
.cwarn{background:#FEF8E6;border:1px solid var(--gold);color:#7A5A12;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.citem{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;background:var(--c);display:grid;gap:4px}
.btn.sm{min-height:44px;font-size:15px}
/* Gaya Tab Booking & modal buat booking */
#bsheet{position:fixed;inset:0;display:flex;background:rgba(8,20,36,.6);align-items:flex-end;justify-content:center;z-index:8;animation:fade .25s}
.bdg.new{background:#E6F4FC;color:#156599;border:1px solid #A8D8F5}
.bdg.cfm{background:#FEF8E6;color:#7A5A12;border:1px solid var(--gold)}
.bcard{background:var(--c);border:1.5px solid var(--ln);border-radius:14px;padding:12px;margin-top:10px;display:grid;gap:6px;box-shadow:0 6px 14px -10px rgba(11,31,54,.35)}
.bcard.void{opacity:.65}
.bcard.void .vn{text-decoration:line-through}
.bacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.bacts>*{flex:1;min-width:110px}
.bnote{background:#FEF8E6;border:1px solid var(--gold);color:#7A5A12;border-radius:10px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.app,nav,#bar,#toast,.acts,#det,#lock,#vform,#csheet,#bsheet{display:none!important}body{background:#fff}#sheet{position:static!important;background:none!important}.box{padding:0!important;max-height:none!important;background:none!important}#struk{border:0;max-width:none;width:58mm;margin:0;padding:2mm 1.5mm}@page{size:58mm auto;margin:0}}
</style></head>
<body>
<div class="app">
<header><div class="tile"><img id="lg" alt="Marisini"></div><div><div class="wm">MARI<b>SINI</b><span class="ps">POS</span></div><button class="lnk" id="who" onclick="askName()"></button></div><div id="st" class="pill" onclick="sync(true)"></div></header>
<main id="kasir"></main><main id="riwayat" hidden></main><main id="booking" hidden></main>
</div>
<div id="bar"><button id="go" class="btn" onclick="save()"></button></div>
<nav><button id="n0" class="on" onclick="tab(0)">Kasir</button><button id="n1" onclick="tab(1)">Riwayat</button><button id="n2" onclick="tab(2)">Booking</button></nav>
<div id="sheet" hidden><div class="box"><div id="det" class="sub"></div><div id="struk"></div><div id="vform" hidden><div class="lbl">Alasan batal (wajib)</div><div class="row" id="vchips"></div><input id="vreason" class="in" placeholder="Tulis alasan batal..." autocomplete="off"><div class="sub" id="verr" style="color:#9B1C1C"></div><button id="vok" class="btn danger" onclick="confirmVoid()">KONFIRMASI BATAL</button><button class="btn ghost" onclick="closeVoidForm()">Kembali</button></div><div class="acts" id="sacts"><button class="btn" id="pbtn" onclick="window.print()">CETAK STRUK</button><a class="btn alt" id="wa" target="_blank" rel="noopener">Kirim ke WhatsApp</a><button class="btn danger-ghost" id="vbtn" onclick="openVoidForm()" hidden>Batalkan Transaksi</button><button class="btn ghost" onclick="closeSheet()">Tutup</button></div></div></div>
<div id="csheet" hidden><div class="box"><div id="cbody" class="cbox"></div></div></div>
<div id="bsheet" hidden><div class="box"><div id="bbody" class="cbox"></div></div></div>
<div id="lock" hidden><div class="lbox"><div class="tile"><img id="lg2" alt=""></div><div class="wm">MARI<b>SINI</b><span class="ps">POS</span></div><div id="pinrow" style="width:100%"><input id="pin" class="in" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"></div><input id="nm" class="in" placeholder="Nama kamu" autocomplete="off"><div class="sub" id="lerr"></div><button class="btn" onclick="login()">MASUK</button><button id="lout" class="btn ghost sm" onclick="out()" hidden style="color:#E9D49A;border-color:rgba(233,212,154,.45)">Ganti PIN / Keluar</button></div></div>

// Paket per cabang: [nama, harga, satuan, komisi tetap per unit (hanya Senggigi)]
const P = {
  Senggigi: [
    ["Jetski 15 menit", 450000, "jetski", 50000],
    ["Jetski 30 menit", 800000, "jetski", 150000],

  ],
  Sira: [
    ["Jetski 30 menit", 1000000, "jetski"],

    ["Ocean Trip 1,5 jam", 3000000, "jetski"],
    ["Coastal Jetski Safari 3 jam", 4500000, "jetski"],

  ]
};
// Komisi: Senggigi tetap per produk/unit (dikali qty), Sira 10% dari harga jual, agent khusus punya persen sendiri
const KOM = { Sira: 0.1 };
const AG = [{ n: "Sofiyan Hadi", pos: "Sira", pct: 0.2 }];

// Aturan komisi untuk satu paket (null = tidak ada komisi)
const rule = (pos, pk) => (pk[3] != null ? { f: pk[3] } : KOM[pos] ? { p: KOM[pos] } : null);

// Hitung komisi berdasarkan harga jual setelah diskon (Senggigi: nominal paket x qty; Sira: % dari harga jual)
const kom = (pos, pk, ag, tot, qty = 1) => {
  if (!ag) return 0;
  const a = AG.find(x => x.n === ag && x.pos === pos);
  if (a) return Math.round(tot * a.pct);
  const r = rule(pos, pk);
  return r ? (r.f != null ? r.f * qty : Math.round(tot * r.p)) : 0;
};

// Hitung rincian transaksi dari parameter input (murni, tanpa tergantung state global)
function calcTx(pos, idx, qty, customTotal, ag) {
  const pk = P[pos][idx];
  const list = pk[1] * qty;
  const tot = customTotal == null ? list : customTotal;
  const k = kom(pos, pk, ag, tot, qty);
  return { pk, list, tot, k, disc: Math.max(0, list - tot), net: tot - k };
}

// Hitung rekap Tutup Kasir (angka bersih per cara bayar, transaksi Batal tidak dihitung)
function calcClose(txRows, pos) {
  let cash = 0, edc = 0, qris = 0, cashCnt = 0, edcCnt = 0, qrisCnt = 0;
  for (let i = 0; i < txRows.length; i++) {
    const r = txRows[i];
    if (r.pos !== pos || r.status === "Batal") continue;
    const net = Number(r.net) || 0;
    if (r.pay === "Tunai") { cash += net; cashCnt++; }
    else if (r.pay === "EDC") { edc += net; edcCnt++; }
    else if (r.pay === "QRIS") { qris += net; qrisCnt++; }
  }
  return {
    sys_cash: cash,
    sys_edc: edc,
    sys_qris: qris,
    sys_total: cash + edc + qris,
    cashCnt,
    edcCnt,
    qrisCnt,
    tx_count: cashCnt + edcCnt + qrisCnt
  };
}

// Simpan transaksi ke antrean lokal dengan kunci anti-ketukan ganda
function save() {
  if (saving) return;
  if (!S.staff) { askName(); return; }
  const c = calc();
  if (!c.tot) { toast("Harga masih 0"); return; }

  // Kunci tombol simpan sesaat agar ketukan ganda tidak membuat transaksi dobel
  saving = true;
  const btn = $("#go");
  if (btn) btn.disabled = true;

  const d = new Date(), z = n => String(n).padStart(2, "0"), ds = day(), hm = z(d.getHours()) + ":" + z(d.getMinutes());
  const t = {
    id: genId(),
    ds,
    time: hm,
    no: S.pos.slice(0, 3).toUpperCase() + "-" + ds.replace(/-/g, "").slice(2) + "-" + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds()),
    pos: S.pos,
    staff: S.staff,
    name: c.pk[0],
    qty: S.qty,
    u: c.pk[2],
    list: c.list,
    total: c.tot,
    disc: c.disc,
    kom: c.k,
    ag: S.ag,
    net: c.net,
    pay: S.pay,
    status: "Aktif",
    void_reason: "",
    void_by: "",
    void_at: ""
  };

  Q.push(t);
  sv("mk2_q", Q);

  // Jika transaksi ini berasal dari Booking, otomatis tandai booking sebagai Selesai
  if (activeBooking) {
    setBookStatus(activeBooking.id, "Selesai", t.id, true);
    activeBooking = null;
  }

  S.total = null;
  S.qty = 1;
  S.ag = "";
  sav();
  view();
  show(t);
  sync();

  // Buka kunci tombol setelah jeda singkat (1,2 detik)
  setTimeout(() => {
    saving = false;
    const b = $("#go");
    if (b) b.disabled = false;
  }, 1200);
}

// Terapkan status Batal ke cache lokal H agar langsung tampil dicoret & tidak ikut rekap
function applyLocalVoid(id, ds, infoVoid) {
  const bucket = H[ds];
  if (bucket) {
    for (let i = 0; i < bucket.length; i++) {
      if (String(bucket[i].id) === String(id)) {
        Object.assign(bucket[i], infoVoid);
      }
    }
    sv("mk2_h", H);
  }
}

// Proses konfirmasi pembatalan transaksi (aman offline lewat antrean VQ)
function confirmVoid() {
  if (!curTx || isVoid(curTx)) return;
  if (!S.staff) { askName(); return; }
  const reason = $("#vreason").value.trim();
  if (!reason) { $("#verr").textContent = "Pilih atau tulis alasan batal dulu"; return; }

  const btn = $("#vok");
  if (btn && btn.disabled) return;
  if (btn) btn.disabled = true;

  const vItem = {
    id: String(curTx.id),
    ds: curTx.ds,
    reason,
    by: S.staff,
    at: nowLocal()
  };

  // Masukkan ke antrean batal (tidak duplikat untuk ID sama)
  VQ = VQ.filter(x => String(x.id) !== vItem.id);
  VQ.push(vItem);
  sv("mk2_vq", VQ);

  const updated = Object.assign({}, curTx, {
    status: "Batal",
    void_reason: reason,
    void_by: S.staff,
    void_at: vItem.at,
    waitVoid: 1
  });
  applyLocalVoid(curTx.id, curTx.ds, {
    status: "Batal",
    void_reason: reason,
    void_by: S.staff,
    void_at: vItem.at,
    waitVoid: 1
  });

  show(updated);
  if (!$("#riwayat").hidden) hist();
  toast("Transaksi ditandai BATAL");
  sync();
}

// Gabungan data dari Sheet + antrean transaksi baru + antrean batal lokal, diurutkan terbaru di atas
const rows = ds => {
  const vMap = new Map();
  VQ.forEach(v => vMap.set(String(v.id), v));

  const a = (H[ds] || []).map(x => {
    const pv = vMap.get(String(x.id));
    return pv ? Object.assign({}, x, { status: "Batal", void_reason: pv.reason, void_by: pv.by, void_at: pv.at, waitVoid: 1 }) : Object.assign({}, x);
  });
  const ids = new Set(a.map(x => String(x.id)));
  Q.forEach(x => {
    if (x.ds === ds && !ids.has(String(x.id))) {
      ids.add(String(x.id));
      const pv = vMap.get(String(x.id));
      a.push(Object.assign(
        { wait: 1 },
        x,
        pv ? { status: "Batal", void_reason: pv.reason, void_by: pv.by, void_at: pv.at, waitVoid: 1 } : {}
      ));
    }
  });
  return a.sort((x, y) => idTime(y.id) - idTime(x.id) || String(y.id).localeCompare(String(x.id)));
};

const flt = () => {
  const ds = isOwner() ? F.ds : day();
  const posLock = isOwner() ? F.pos : S.pos;
  return rows(ds).filter(x =>
    (!posLock || x.pos === posLock) &&
    (!F.pay || x.pay === F.pay) &&
    (!F.q || (x.name + " " + x.staff + " " + x.no + " " + x.ag + " " + (x.void_reason || "")).toLowerCase().includes(F.q.toLowerCase()))
  );
};

function fl(k, v) { F[k] = v; hist(); }

// Gabungan catatan Tutup Kasir dari Sheet + antrean lokal untuk tanggal (dan opsional cabang)
const closeRows = (ds, pos) => {
  const a = (CH[ds] || []).slice();
  const ids = new Set(a.map(x => String(x.id)));
  CQ.forEach(x => {
    if (x.ds === ds && !ids.has(String(x.id))) {
      ids.add(String(x.id));
      a.push(Object.assign({ wait: 1 }, x));
    }
  });
  return a
    .filter(x => !pos || x.pos === pos)
    .sort((x, y) => idTime(y.id) - idTime(x.id) || String(y.id).localeCompare(String(x.id)));
};

// Format teks & kelas warna selisih uang tunai
const fmtDiff = diff => {
  if (diff === 0) return { cls: "ok", text: "Selisih: Pas (Rp 0)" };
  if (diff > 0) return { cls: "pos", text: "Selisih: Lebih +" + rp(diff) };
  return { cls: "neg", text: "Selisih: Kurang -" + rp(Math.abs(diff)) };
};

  const d = fmtDiff(Number(CS.phys) - sum.sys_cash);

  el.textContent = d.text;

// Simpan tutup kasir ke antrean lokal (CQ) lalu sinkronkan ke tab Sheet "Tutup Kasir"
function saveClose() {
  if (closing) return;
  if (!S.staff) { askName(); return; }
  if (CS.phys === "") {
    $("#cerr").textContent = "Isi jumlah uang tunai fisik dulu (isi 0 jika tidak ada tunai)";
    return;
  }

  closing = true;
  const btn = $("#cgo");
  if (btn) btn.disabled = true;

  const physCash = Number(CS.phys) || 0;
  const sum = calcClose(rows(F.ds), CS.pos);
  const rec = {
    id: genId(),
    ds: F.ds,
    pos: CS.pos,
    staff: S.staff,
    srv_ts: nowLocal(),
    sys_cash: sum.sys_cash,
    sys_edc: sum.sys_edc,
    sys_qris: sum.sys_qris,
    sys_total: sum.sys_total,
    phys_cash: physCash,
    diff: physCash - sum.sys_cash,
    tx_count: sum.tx_count,
    note: CS.note.trim()
  };

  CQ.push(rec);
  sv("mk2_cq", CQ);
  CS.phys = "";
  CS.note = "";

  toast("Tutup kasir disimpan");
  closeModal();
  showCloseReceipt(rec);
  if (!$("#riwayat").hidden) hist();
  sync();

  setTimeout(() => {
    closing = false;
    const b = $("#cgo");
    if (b) b.disabled = false;
  }, 1200);
}

    ? `<div class="row" style="margin-top:12px">${["", "Senggigi", "Sira"].map(p => chip(p || "Semua cabang", F.pos === p, `fl('pos','${p}')`)).join("")}</div>`

  $("#riwayat").innerHTML = `${dateHtml}
${rekapHtml}

// Kirim permintaan POST ke Apps Script (PIN selalu di body, bukan di URL)
async function post(b) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(b)
  });
  return r.json();
}

// Ambil riwayat bersama dari Sheet (staf hanya memuat hari ini & cabang aktif)
async function load() {
  if (!PINV) return;
  const dsReq = isOwner() ? F.ds : day();
  if (!isOwner()) F.ds = dsReq;
  try {
    const payload = { action: "list", pin: PINV, ds: dsReq };
    if (!isOwner()) payload.pos = S.pos;
    const j = await post(payload);
    if (j.ok) {
      if (j.role && j.role !== ROLE) {
        ROLE = j.role;
        sv("mk2_r", ROLE);
        hdr();
      }
      const keyDs = j.ds || dsReq;
      H[keyDs] = j.rows || [];
      CH[keyDs] = j.closings || [];
      const ks = Object.keys(H).sort();
      while (ks.length > 7) { const old = ks.shift(); delete H[old]; delete CH[old]; }
      sv("mk2_h", H);
      sv("mk2_ch", CH);
      if (!$("#riwayat").hidden) hist();
      if (!$("#csheet").hidden) renderClose();
    } else if (j.err === "pin") {
      out();
    }
  } catch (e) {}
}

// Kirim antrean transaksi baru (Q), lalu batal (VQ), lalu tutup kasir (CQ) ke Sheet
async function sync(m) {
  if (!PINV || busy) { stat(); return; }
  busy = true;
  let gagalJaringan = false;

  // 1. Kirim transaksi baru dulu
  for (const t of Q.slice()) {
    try {
      const j = await post({ pin: PINV, t });
      if (j.ok) {
        Q = Q.filter(x => String(x.id) !== String(t.id));
        sv("mk2_q", Q);
        const bucket = (H[t.ds] = H[t.ds] || []);
        if (!bucket.some(x => String(x.id) === String(t.id))) {
          bucket.push(j.srv_ts ? Object.assign({}, t, { srv_ts: j.srv_ts }) : t);
        }
        sv("mk2_h", H);
      } else {
        if (j.err === "pin") out();
        else if (j.err === "terkunci" && m) toast("PIN terkunci 10 menit. Coba lagi nanti.");
        else if (j.err === "pin_belum_diatur" && m) toast("PIN belum diatur di server.");
        gagalJaringan = true;
        break;
      }
    } catch (e) {
      if (m) toast("Belum ada sinyal. Data aman di HP");
      gagalJaringan = true;
      break;
    }
  }

  // 2. Kirim antrean pembatalan (hanya jika transaksi terkait sudah tidak ada di Q)
  if (!gagalJaringan) {
    for (const v of VQ.slice()) {
      if (Q.some(x => String(x.id) === String(v.id))) continue;
      try {
        const j = await post({ action: "void", pin: PINV, id: v.id, ds: v.ds, reason: v.reason, by: v.by });
        if (j.ok) {
          VQ = VQ.filter(x => String(x.id) !== String(v.id));
          sv("mk2_vq", VQ);
          applyLocalVoid(v.id, v.ds, {
            status: "Batal",
            void_reason: j.void_reason || v.reason,
            void_by: j.void_by || v.by,
            void_at: j.void_at || v.at,
            waitVoid: 0
          });
          if (curTx && String(curTx.id) === String(v.id) && !$("#sheet").hidden) {
            show(rows(v.ds).find(y => String(y.id) === String(v.id)) || curTx);
          }
        } else if (j.err === "pin") {
          out();
          gagalJaringan = true;
          break;
        } else if (j.err === "bukan_hari_ini" || j.err === "tidak_ditemukan" || j.err === "alasan_wajib") {
          VQ = VQ.filter(x => String(x.id) !== String(v.id));
          sv("mk2_vq", VQ);
          toast(j.err === "bukan_hari_ini" ? "Batal ditolak: bukan transaksi hari ini" : "Pembatalan tidak dapat diproses");
          load();
        } else {
          if (j.err === "terkunci" && m) toast("PIN terkunci 10 menit. Coba lagi nanti.");
          gagalJaringan = true;
          break;
        }
      } catch (e) {
        if (m) toast("Belum ada sinyal. Pembatalan aman di HP");
        gagalJaringan = true;
        break;
      }
    }
  }

  // 3. Kirim antrean Tutup Kasir setelah Q dan VQ selesai agar nominal sistem di server akurat
  if (!gagalJaringan && Q.length === 0 && VQ.length === 0) {
    for (const c of CQ.slice()) {
      try {
        const j = await post({ action: "close_day", pin: PINV, c });
        if (j.ok) {
          CQ = CQ.filter(x => String(x.id) !== String(c.id));
          sv("mk2_cq", CQ);
          const saved = j.row || c;
          const bucket = (CH[saved.ds] = CH[saved.ds] || []);
          if (!bucket.some(x => String(x.id) === String(saved.id))) {
            bucket.push(saved);
          }
          sv("mk2_ch", CH);
        } else if (j.err === "pin") {
          out();
          gagalJaringan = true;
          break;
        } else {
          if (j.err === "terkunci" && m) toast("PIN terkunci 10 menit. Coba lagi nanti.");
          gagalJaringan = true;
          break;
        }
      } catch (e) {
        if (m) toast("Belum ada sinyal. Tutup kasir aman di HP");
        gagalJaringan = true;
        break;
      }
    }
  }

  // 4. Kirim antrean Booking baru (BQ)
  if (!gagalJaringan) {
    for (const b of BQ.slice()) {
      try {
        const j = await post({ action: "save_booking", pin: PINV, b });
        if (j.ok) {
          BQ = BQ.filter(x => String(x.id) !== String(b.id));
          sv("mk2_bq", BQ);
          const saved = j.row || b;
          if (!BH.some(x => String(x.id) === String(saved.id))) BH.push(saved);
          sv("mk2_bh", BH);
        } else if (j.err === "pin") {
          out();
          gagalJaringan = true;
          break;
        } else {
          gagalJaringan = true;
          break;
        }
      } catch (e) {
        if (m) toast("Belum ada sinyal. Booking aman di HP");
        gagalJaringan = true;
        break;
      }
    }
  }

  // 5. Kirim antrean perubahan status Booking (BUQ) setelah BQ terkait terkirim
  if (!gagalJaringan) {
    for (const u of BUQ.slice()) {
      if (BQ.some(x => String(x.id) === String(u.id))) continue;
      try {
        const j = await post({ action: "update_booking", pin: PINV, id: u.id, status: u.status, tx_id: u.tx_id || "" });
        if (j.ok) {
          BUQ = BUQ.filter(x => String(x.id) !== String(u.id));
          sv("mk2_buq", BUQ);
          applyLocalBookStatus(u.id, u.status, u.tx_id || "");
        } else if (j.err === "pin") {
          out();
          break;
        } else if (j.err === "tidak_ditemukan" || j.err === "status_tidak_valid") {
          BUQ = BUQ.filter(x => String(x.id) !== String(u.id));
          sv("mk2_buq", BUQ);
        } else {
          break;
        }
      } catch (e) {
        if (m) toast("Belum ada sinyal. Update booking aman di HP");
        break;
      }
    }
  }

  busy = false;
  stat();
  if (!$("#riwayat").hidden) hist();
  if (!$("#csheet").hidden) renderClose();
  if (!$("#booking").hidden) bookView();
}

// === FITUR BOOKING (§7.4) ===
// Normalisasi nomor WA Indonesia (08xx -> 628xx) untuk tombol chat WA cepat
const waLink = (num, text) => {
  let d = String(num || "").replace(/\D/g, "");
  if (d.startsWith("0")) d = "62" + d.slice(1);
  return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
};

// Gabungan data Booking dari Sheet + antrean baru (BQ) + antrean update status (BUQ)
const bookRows = () => {
  const uMap = new Map();
  BUQ.forEach(u => uMap.set(String(u.id), u));
  const list = (BH || []).map(x => {
    const u = uMap.get(String(x.id));
    return u ? Object.assign({}, x, { status: u.status, tx_id: u.tx_id || x.tx_id, waitUpd: 1 }) : Object.assign({}, x);
  });
  const ids = new Set(list.map(x => String(x.id)));
  BQ.forEach(x => {
    if (!ids.has(String(x.id))) {
      ids.add(String(x.id));
      const u = uMap.get(String(x.id));
      list.push(Object.assign({ wait: 1 }, x, u ? { status: u.status, tx_id: u.tx_id || x.tx_id, waitUpd: 1 } : {}));
    }
  });
  return list.sort((a, b) => (a.ds + " " + a.time).localeCompare(b.ds + " " + b.time));
};

function applyLocalBookStatus(id, status, txId) {
  for (let i = 0; i < BH.length; i++) {
    if (String(BH[i].id) === String(id)) {
      BH[i].status = status;
      if (txId) BH[i].tx_id = txId;
    }
  }
  sv("mk2_bh", BH);
}

// Simpan booking baru (tahan ketukan ganda & aman offline lewat antrean BQ)
function saveBooking() {
  if (savingBook) return;
  if (!S.staff) { askName(); return; }
  const cust = String(BS.cust || "").trim();
  if (!cust) { $("#berr").textContent = "Isi nama tamu dulu"; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(BS.ds)) { $("#berr").textContent = "Pilih tanggal booking"; return; }

  savingBook = true;
  const btn = $("#bgo");
  if (btn) btn.disabled = true;

  const pk = P[BS.pos][BS.i] || P[BS.pos][0];
  const rec = {
    id: genId(),
    ds: BS.ds,
    time: BS.time || "10:00",
    pos: BS.pos,
    cust: cust,
    wa: String(BS.wa || "").trim(),
    name: pk[0],
    qty: BS.qty,
    u: pk[2],
    status: "Baru",
    note: String(BS.note || "").trim(),
    staff: S.staff,
    srv_ts: nowLocal(),
    tx_id: ""
  };

  BQ.push(rec);
  sv("mk2_bq", BQ);
  closeBookForm();
  toast("Booking disimpan");
  if (!$("#booking").hidden) bookView();
  sync();

  setTimeout(() => {
    savingBook = false;
    const b = $("#bgo");
    if (b) b.disabled = false;
  }, 1200);
}

// Ubah status booking (Konfirmasi / Selesai / Batal) secara offline-safe
function setBookStatus(id, status, txId, silent) {
  const sid = String(id);
  BUQ = BUQ.filter(x => String(x.id) !== sid);
  BUQ.push({ id: sid, status, tx_id: txId || "" });
  sv("mk2_buq", BUQ);
  applyLocalBookStatus(sid, status, txId || "");
  if (!silent) {
    toast("Status booking: " + status);
    if (!$("#booking").hidden) bookView();
    sync();
  }
}

// Satu ketukan "Jadikan transaksi": isi tab Kasir otomatis dari data Booking
function bookingToKasir(id) {
  const b = bookRows().find(x => String(x.id) === String(id));
  if (!b) return;
  const pos = P[b.pos] ? b.pos : "Senggigi";
  const idx = Math.max(0, P[pos].findIndex(x => x[0] === b.name));
  S.pos = pos;
  S.i = idx;
  S.qty = Math.max(1, Number(b.qty) || 1);
  S.total = null;
  S.ag = "";
  activeBooking = b;
  sav();
  view();
  tab(0);
  toast("Form kasir diisi dari booking " + b.cust);
}

function stat() {
  const e = $("#st");
  const pending = Q.length + VQ.length + CQ.length + BQ.length + BUQ.length;
  e.className = "pill" + (pending ? " w" : "");
  e.textContent = !PINV ? "Belum masuk" : pending ? pending + " belum terkirim" : "Tersambung";
}

// Keluar & bersihkan cache riwayat agar data Pemilik tidak tertinggal di HP Staf
function out() {
  PINV = ""; sv("mk2_p", "");
  ROLE = "staf"; sv("mk2_r", "staf");
  H = {}; sv("mk2_h", {});
  CH = {}; sv("mk2_ch", {});
  BH = []; sv("mk2_bh", []);
  activeBooking = null;
  F.ds = day(); F.pos = "";
  hdr(); stat(); askName();
}

function hdr() {
  const label = isOwner() ? "Pemilik" : "Staf";
  $("#who").textContent = S.staff ? `${label}: ${S.staff} (ganti)` : "Isi nama staf";
}

function askName() {
  $("#pinrow").hidden = !!PINV;
  const lo = $("#lout");
  if (lo) lo.hidden = !PINV;
  $("#nm").value = S.staff;
  $("#lerr").textContent = "";
  $("#lock").hidden = false;
}

// Login dengan cek PIN ke server (menyimpan PIN + peran staf/pemilik di HP)
async function login() {
  const p = $("#pin").value.trim(), n = $("#nm").value.trim(), e = $("#lerr");
  if (!n) { e.textContent = "Isi nama kamu"; return; }
  if ($("#pinrow").hidden) { S.staff = n; sav(); $("#lock").hidden = true; hdr(); return; }
  if (!p) { e.textContent = "Isi PIN"; return; }
  e.textContent = "Memeriksa...";
  try {
    const j = await post({ action: "login", pin: p });
    if (j.ok) {
      PINV = p; sv("mk2_p", p);
      ROLE = j.role || "staf"; sv("mk2_r", ROLE);
      S.staff = n; sav();
      F.ds = day();
      F.pos = isOwner() ? "" : S.pos;
      $("#pin").value = "";
      $("#lock").hidden = true;
      hdr(); stat(); sync();
      if (!$("#riwayat").hidden) { hist(); load(); }
      if (!$("#booking").hidden) { bookView(); loadBookings(); }
    } else if (j.err === "terkunci") {
      e.textContent = "Terlalu banyak percobaan. Coba lagi 10 menit lagi.";
    } else if (j.err === "pin_belum_diatur") {
      e.textContent = "PIN belum diatur di server. Hubungi pemilik.";
    } else {
      e.textContent = "PIN salah";
    }
  } catch (x) {
    e.textContent = "Butuh sinyal untuk masuk pertama kali";
  }
}

function tab(i) {
  $("#kasir").hidden = i !== 0;
  $("#riwayat").hidden = i !== 1;
  $("#booking").hidden = i !== 2;
  $("#bar").hidden = i !== 0;
  $("#n0").className = i === 0 ? "on" : "";
  $("#n1").className = i === 1 ? "on" : "";
  $("#n2").className = i === 2 ? "on" : "";
  if (i === 1) { hist(); load(); fx($("#riwayat")); }
  else if (i === 2) { bookView(); loadBookings(); fx($("#booking")); }
  else fx($("#kasir"));
}

function fx(e) { e.classList.add("fx"); setTimeout(() => e.classList.remove("fx"), 1000); }
let tm;
function toast(m) {
  const e = $("#toast");
  e.textContent = m;
  e.className = "s";
  clearTimeout(tm);
